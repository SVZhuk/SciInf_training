[project]
name = "lab-sample-registry-api"
version = "1.0.0"
description = "FastAPI + Pydantic v2 teaching demo: REST CRUD over DNA samples."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "pytest>=8.0",
    "sqlalchemy[asyncio]>=2.0.54",
    "asyncpg>=0.31.0",
    "pydantic-settings>=2.15.0",
    "alembic>=1.20.0",
    "jinja2>=3.1.6",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest-asyncio>=1.4.0",
    "pyright>=1.1.414",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --tb=short -rfE"
asyncio_mode = "auto"
# session-scoped so the session-scoped test_engine fixture (tests/conftest.py) and
# every test share one event loop; otherwise asyncpg connections from the engine's
# loop get used from a different per-test loop and raise "attached to a different loop"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# third-party deprecation noise (starlette/fastapi internals), keeps test output short
filterwarnings = [
    "ignore:Using .httpx. with .starlette.testclient.:UserWarning",
    "ignore::DeprecationWarning:starlette.testclient",
]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ANN", "PT", "T20", "BLE"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"client.py" = ["T20"]
"fetch_uniprot.py" = ["T20"]
"scripts/*" = ["T20"]
"scratchpad.py" = ["T20"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
cache_dir = "/dev/null"

[tool.pyright]
include = ["app"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
