# Production stack: same file locally and on the EC2 host. Not started by default:
#   docker compose --profile prod up --build    -> db healthy, migrate exits 0, api on :8000
# Local dev with live reload (never runs on EC2, which only ever calls plain `up`):
#   docker compose --profile prod up --build --watch
# On EC2, /opt/lab-samples/.env sets IMAGE (ECR, per commit), POSTGRES_PASSWORD, API_PORT=80
# and RESTART_POLICY=unless-stopped (written by deploy/ec2-bootstrap.sh and deploy/deploy.sh).
x-api: &api
  profiles: [prod]
  build:
    context: .
    dockerfile: Dockerfile
  image: ${IMAGE:-lab-sample-registry:local}
  environment:
    DATABASE_URL: postgresql+asyncpg://app:${POSTGRES_PASSWORD:-app}@db:5432/lab_samples

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: lab_samples
    ports:
      - "127.0.0.1:5434:5432"   # host-only: never reachable from the network
    restart: ${RESTART_POLICY:-no}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d lab_samples"]
      interval: 5s
      timeout: 5s
      retries: 5

  test_db:
    profiles: [test]   # not part of "prod"; still starts via conftest.py's explicit `up test_db`
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: lab_samples_test
    ports:
      - "127.0.0.1:5433:5432"   # host-only: never reachable from the network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d lab_samples_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    <<: *api
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *api
    restart: ${RESTART_POLICY:-no}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    develop:
      watch:
        - action: sync+restart
          path: ./app
          target: /app/app
        - action: rebuild
          path: ./pyproject.toml
        - action: rebuild
          path: ./uv.lock

volumes:
  db_data:
